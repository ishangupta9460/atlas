spring:
  datasource:
    url: jdbc:h2:mem:atlas_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

atlas:
  jwt:
    secret: "test-only-atlas-jwt-secret-not-used-in-production-64-chars-padding"
    expiration-ms: 3600000

