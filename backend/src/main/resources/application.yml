server:
  port: ${SERVER_PORT:8080}

logging:
  structured:
    format:
      console: logstash
      file: logstash

spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: atlas-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate auto-DDL.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

atlas:
  ai:
    enabled: ${ATLAS_AI_ENABLED:true}
    provider: gemini
    api-key: ${ATLAS_AI_API_KEY:}
    model: ${ATLAS_AI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  recovery:
    confidence-threshold: ${ATLAS_GOAL_RISK_THRESHOLD:0.80}
  jwt:
    secret: ${ATLAS_JWT_SECRET}
    expiration-ms: ${ATLAS_JWT_EXPIRATION_MS:86400000}

